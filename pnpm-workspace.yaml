packages:
  - packages/*
  - apps/*
  - docs

allowBuilds:
  '@serialport/bindings-cpp': true
  bcrypt: true
  esbuild: true
  msgpackr-extract: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.6.0
  vite-plus: 1.6.0
overrides:
  vite@*: 'catalog:'
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
